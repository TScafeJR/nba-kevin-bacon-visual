nodeLinker: node-modules

# keep `yarn add` pinning exact versions
defaultSemverRangePrefix: ""

packageExtensions:
  # the app imports vis-network/standalone, which bundles these
  vis-network@*:
    peerDependenciesMeta:
      "@egjs/hammerjs":
        optional: true
      component-emitter:
        optional: true
      keycharm:
        optional: true
      uuid:
        optional: true
      vis-data:
        optional: true
      vis-util:
        optional: true
